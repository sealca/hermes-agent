name: Review polish 118135

on:
  push:
    branches: [ci/review-polish-118135]

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
      - run: uv sync --locked --python 3.11 --extra all --extra dev
      - name: Focused handoff tests
        shell: bash
        run: scripts/run_tests.sh tests/hermes_cli/test_desktop_update_request.py -q
      - name: Ruff
        shell: bash
        run: uv run --no-sync ruff check hermes_cli/desktop_update_request.py tests/hermes_cli/test_desktop_update_request.py
