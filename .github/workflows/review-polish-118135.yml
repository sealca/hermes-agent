name: Publish rebased PR 118135

on:
  push:
    branches: [ci/review-polish-118135]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BASE: ci/rebased-feature-118135
      EXPECTED_BASE: fde4997f580c3480798fdf9c7e92c0079d6e03d6
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Reconstruct the already-validated rebase
        shell: bash
        run: |
          git config user.name "Sealcadev"
          git config user.email "100358515+sealca@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream "$EXPECTED_BASE"
          git checkout --detach "$EXPECTED_BASE"

          set +e
          git cherry-pick 1c8292d3c9780092c511da81ca2b66ddf8397777
          first_rc=$?
          set -e
          if [ "$first_rc" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            test "$unresolved" = "apps/desktop/electron/preload.ts"
            git checkout --ours apps/desktop/electron/preload.ts
            python - <<'PY'
          from pathlib import Path
          path = Path("apps/desktop/electron/preload.ts")
          text = path.read_text(encoding="utf-8")
          marker = "  onOpenUpdatesRequested: callback => {\n"
          block = """  onUpdateAllRequested: callback => {
              const listener = (_event, id: string) => {
                void Promise.resolve()
                  .then(callback)
                  .finally(() => ipcRenderer.invoke('hermes:update-all-complete', id))
                  .catch(error => console.error('[updates] update-all request failed:', error))
              }

              ipcRenderer.on('hermes:update-all-requested', listener)
              void ipcRenderer.invoke('hermes:update-all-ready')

              return () => ipcRenderer.removeListener('hermes:update-all-requested', listener)
            },
          """
          if "onUpdateAllRequested:" in text:
              raise SystemExit("update-all preload bridge unexpectedly already present")
          if marker not in text:
              raise SystemExit("preload insertion marker moved")
          path.write_text(text.replace(marker, block + marker, 1), encoding="utf-8")
          PY
            git add apps/desktop/electron/preload.ts
            GIT_EDITOR=true git cherry-pick --continue
          fi

          set +e
          git cherry-pick bf5e23088226a9b49ff4ef14063f9fa39f771fe4
          second_rc=$?
          set -e
          if [ "$second_rc" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' apps/desktop/electron/main.ts apps/desktop/electron/preload.ts | sort)"
            test "$unresolved" = "$expected"
            git checkout --ours apps/desktop/electron/main.ts apps/desktop/electron/preload.ts
            python - <<'PY'
          from pathlib import Path
          path = Path("apps/desktop/electron/main.ts")
          text = path.read_text(encoding="utf-8")
          loading = "  mainWindow.webContents.on('did-start-loading', () => updateAllLaunch.rendererGone())\n"
          gone = "  mainWindow.webContents.on('render-process-gone', () => updateAllLaunch.rendererGone())\n"
          if gone not in text:
              if loading not in text:
                  raise SystemExit("rendererGone insertion marker moved")
              text = text.replace(loading, loading + gone, 1)

          old = """    const updateRequest = typeof additionalData?.updateAllRequest === 'string'
                ? additionalData.updateAllRequest
                : takeUpdateAllLaunchArg(argv)
          """
          new = """    const updateRequest =
                additionalData &&
                typeof additionalData === 'object' &&
                'updateAllRequest' in additionalData &&
                typeof additionalData.updateAllRequest === 'string'
                  ? additionalData.updateAllRequest
                  : takeUpdateAllLaunchArg(argv)
          """
          if old in text:
              text = text.replace(old, new, 1)
          elif "'updateAllRequest' in additionalData" not in text:
              raise SystemExit("second-instance update request guard moved")
          path.write_text(text, encoding="utf-8")
          PY
            git add apps/desktop/electron/main.ts apps/desktop/electron/preload.ts
            GIT_EDITOR=true git cherry-pick --continue
          fi

          git cherry-pick 919c5368037e605560f4d0996cc605ce31081800
          git diff "$EXPECTED_BASE"...HEAD --check

          cat > /tmp/expected-files <<'EOF'
          apps/desktop/e2e/update-all-launch.spec.ts
          apps/desktop/electron/main.ts
          apps/desktop/electron/preload.ts
          apps/desktop/electron/update-all-launch.test.ts
          apps/desktop/electron/update-all-launch.ts
          apps/desktop/src/app/contrib/hooks/use-desktop-integrations.ts
          apps/desktop/src/global.d.ts
          apps/desktop/src/store/update-all-launch.test.ts
          apps/desktop/src/store/update-all-launch.ts
          apps/desktop/src/store/updates.test.ts
          apps/desktop/src/store/updates.ts
          hermes_cli/desktop_update_request.py
          hermes_cli/main_desktop.py
          hermes_cli/subcommands/gui.py
          tests/hermes_cli/test_desktop_update_request.py
          website/docs/reference/cli-commands.md
          website/docs/user-guide/multi-connection-desktop.md
          EOF
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Publish exact rebased tree as one feature commit
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["TARGET_BASE"]
          base = os.environ["EXPECTED_BASE"]
          api = "https://api.github.com"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          ref = request("GET", f"/repos/{repo}/git/ref/heads/{branch}")
          if ref["object"]["sha"] != base:
              raise SystemExit(f"{branch} moved: {ref['object']['sha']} != {base}")

          base_commit = request("GET", f"/repos/{repo}/git/commits/{base}")
          files = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}...HEAD"], text=True
          ).splitlines()

          tree = []
          for path in files:
              content = open(path, "rb").read()
              blob = request("POST", f"/repos/{repo}/git/blobs", {
                  "content": base64.b64encode(content).decode(),
                  "encoding": "base64",
              })
              tree.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})

          new_tree = request("POST", f"/repos/{repo}/git/trees", {
              "base_tree": base_commit["tree"]["sha"],
              "tree": tree,
          })
          commit = request("POST", f"/repos/{repo}/git/commits", {
              "message": "feat(desktop): expose update-all as a one-shot CLI action\n\nCloses NousResearch/hermes-agent#118098. Rebased onto current upstream main and includes reviewer polish.",
              "tree": new_tree["sha"],
              "parents": [base],
          })
          request("PATCH", f"/repos/{repo}/git/refs/heads/{branch}", {
              "sha": commit["sha"],
              "force": True,
          })
          print(commit["sha"])
          PY
