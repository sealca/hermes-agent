name: Recover PR 118135 - diagnose

on:
  push:
    branches: [ci/review-polish-118135]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OLD_HEAD: 58e9822445a468c155bc070e61aef170a0469071
      OLD_BASE: fde4997f580c3480798fdf9c7e92c0079d6e03d6
      NEW_BASE: f4bdc3dd28f4fc98f618db9323be1262b107f995
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Reproduce conflicts without publishing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sealcadev'
          git config user.email '100358515+sealca@users.noreply.github.com'
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags --depth=2 origin "$OLD_HEAD"
          git fetch --no-tags --depth=1 upstream "$NEW_BASE"
          git checkout --detach "$NEW_BASE"
          echo '=== Affected files ==='
          git diff --name-only "$OLD_BASE" "$OLD_HEAD" > /tmp/pr-files
          cat /tmp/pr-files
          echo '=== Upstream changes in affected files ==='
          mapfile -t paths < /tmp/pr-files
          git diff --stat "$OLD_BASE" "$NEW_BASE" -- "${paths[@]}"
          echo '=== Current engineering guides ==='
          git ls-tree -r --name-only HEAD | grep -E '(^|/)(AGENTS|ENGINEERING|CLAUDE)\.md$' | grep -E '^(AGENTS|ENGINEERING|CLAUDE)|^(hermes_cli|apps/desktop)/' || true
          echo '=== Three-way replay of existing reviewed commit ==='
          set +e
          git cherry-pick --no-commit "$OLD_HEAD"
          rc=$?
          set -e
          echo "CHERRY_PICK_EXIT=$rc"
          echo '=== Conflicted files ==='
          git diff --name-only --diff-filter=U
          echo '=== Conflict hunks ==='
          git diff --cc
          echo '=== Current package setup ==='
          cat apps/desktop/package.json
          echo '=== Current test runner ==='
          sed -n '1,220p' scripts/run_tests.sh
          echo '=== Current root JS package ==='
          cat package.json
          echo '=== Upstream update-all references ==='
          git grep -n -E 'update-all|applyEverythingUpdate|onOpenUpdatesRequested' "$NEW_BASE" -- hermes_cli/main_desktop.py hermes_cli/subcommands/gui.py apps/desktop/electron/main.ts apps/desktop/electron/preload.ts apps/desktop/src/store/updates.ts apps/desktop/src/app/contrib/hooks/use-desktop-integrations.ts || true
          mkdir -p /tmp/recovery-evidence
          git diff --cc > /tmp/recovery-evidence/conflicts.diff
          git diff "$OLD_BASE" "$NEW_BASE" -- "${paths[@]}" > /tmp/recovery-evidence/upstream.diff
          git diff --name-only --diff-filter=U > /tmp/recovery-evidence/conflicted-files.txt
          git status --short > /tmp/recovery-evidence/status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr-118135-conflict-evidence
          path: /tmp/recovery-evidence
          retention-days: 7
