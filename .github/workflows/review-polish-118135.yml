name: Recover PR 118135 - validate

on:
  push:
    branches: [ci/review-polish-118135]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OLD_HEAD: 58e9822445a468c155bc070e61aef170a0469071
      OLD_BASE: fde4997f580c3480798fdf9c7e92c0079d6e03d6
      NEW_BASE: f4bdc3dd28f4fc98f618db9323be1262b107f995
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Replay the reviewed commit and resolve only observed conflicts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery-evidence
          git config user.name 'Sealcadev'
          git config user.email '100358515+sealca@users.noreply.github.com'
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags --depth=2 origin "$OLD_HEAD"
          git fetch --no-tags --depth=1 upstream "$NEW_BASE"
          git checkout --detach "$NEW_BASE"
          set +e
          git cherry-pick --no-commit "$OLD_HEAD"
          rc=$?
          set -e
          test "$rc" = 1
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          main = 'apps/desktop/electron/main.ts'
          hook = 'apps/desktop/src/app/contrib/hooks/use-desktop-integrations.ts'
          cli = 'hermes_cli/main_desktop.py'
          actual = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          assert sorted(actual) == sorted([main, hook, cli]), actual
          conflicts = re.compile(r'^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>>[^\n]*\n', re.M | re.S)

          path = Path(main)
          text = path.read_text()
          matches = list(conflicts.finditer(text))
          assert len(matches) == 2
          def resolve_main(match):
              ours, theirs = match.groups()
              assert not ours.strip()
              if "from './update-all-launch'" in theirs:
                  assert "from './update-api-check'" in theirs
                  return "import { createUpdateAllLaunch, takeUpdateAllLaunchArg } from './update-all-launch'\n"
              assert 'const _gotSingleInstanceLock' in theirs
              return ''
          text = conflicts.sub(resolve_main, text)
          old = 'const isPrimaryInstance: boolean = app.requestSingleInstanceLock()'
          assert text.count(old) == 1
          text = text.replace(old, 'const isPrimaryInstance: boolean = app.requestSingleInstanceLock({ updateAllRequest: initialUpdateAllRequest })')
          assert text.index('const initialUpdateAllRequest =') < text.index('app.requestSingleInstanceLock(')
          assert text.count('app.requestSingleInstanceLock(') == 1
          assert "from './update-api-check'" not in text
          path.write_text(text)

          path = Path(hook)
          text = path.read_text()
          assert len(conflicts.findall(text)) == 1
          def resolve_hook(match):
              ours, theirs = match.groups()
              assert 'requestSkillInstallFromDeepLink' in ours
              assert 'updateAllFromLauncher' in theirs
              return ours + theirs
          path.write_text(conflicts.sub(resolve_hook, text))

          path = Path(cli)
          text = path.read_text()
          assert len(conflicts.findall(text)) == 1
          def resolve_cli(match):
              ours, theirs = match.groups()
              old_guard = '    if not (desktop_dir / "package.json").exists():\n'
              assert theirs.endswith(old_guard)
              assert 'bundled = is_bundled_payload(PROJECT_ROOT)' in ours
              return theirs[:-len(old_guard)] + ours
          path.write_text(conflicts.sub(resolve_cli, text))
          PY
          git add apps/desktop/electron/main.ts apps/desktop/src/app/contrib/hooks/use-desktop-integrations.ts hermes_cli/main_desktop.py
          git diff --cached --check
          git -c commit.gpgsign=false commit -C "$OLD_HEAD"
          git diff --name-only "$OLD_BASE" "$OLD_HEAD" | sort > /tmp/expected-files
          git diff --name-only "$NEW_BASE" HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff "$NEW_BASE" HEAD --check
          git diff --stat "$NEW_BASE" HEAD
          git range-diff "$OLD_BASE..$OLD_HEAD" "$NEW_BASE..HEAD" > /tmp/recovery-evidence/range-diff.txt
          cat /tmp/recovery-evidence/range-diff.txt
          git diff --binary "$NEW_BASE" HEAD > /tmp/recovery-evidence/recovered.patch
          while IFS= read -r file; do
            mkdir -p "/tmp/recovery-evidence/source/$(dirname "$file")"
            cp "$file" "/tmp/recovery-evidence/source/$file"
          done < /tmp/actual-files
          git ls-files 'tests/*desktop*' 'tests/hermes_cli/*desktop*' > /tmp/recovery-evidence/python-test-paths.txt
      - name: Prepare the current locked Python and Node toolchain
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          test-environment: 'true'
      - name: Python launcher and adjacent desktop tests
        id: python
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(git ls-files 'tests/hermes_cli/test_desktop*.py' 'tests/hermes_cli/test_main_desktop*.py' 'tests/test_main_desktop*.py')
          test "${#paths[@]}" -gt 0
          printf '%s\n' "${paths[@]}"
          scripts/run_tests.sh -j 2 "${paths[@]}" --file-retries 0 2>&1 | tee /tmp/recovery-evidence/python-tests.log
      - name: Install committed JavaScript dependencies
        id: npm
        if: ${{ !cancelled() }}
        run: npm ci --no-audit --no-fund
      - name: Desktop update and launcher regression tests
        id: unit
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run electron/update-all-launch.test.ts src/store/update-all-launch.test.ts src/store/updates.test.ts electron/backend-release-gate.test.ts electron/dock-launch-order.test.ts --maxWorkers=2 2>&1 | tee /tmp/recovery-evidence/desktop-tests.log
      - name: Full desktop typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck --workspace apps/desktop 2>&1 | tee /tmp/recovery-evidence/typecheck.log
      - name: Build real Desktop
        id: build
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build --workspace apps/desktop 2>&1 | tee /tmp/recovery-evidence/build.log
      - name: Real Electron handoff three times without retries or real updates
        id: e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a npx playwright test e2e/update-all-launch.spec.ts --repeat-each=3 --workers=1 --retries=0 --reporter=line 2>&1 | tee /tmp/recovery-evidence/e2e.log
      - name: Publish validated candidate only, never the PR branch
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          base = os.environ['NEW_BASE']
          old = os.environ['OLD_HEAD']
          def api(method, path, payload=None):
              request = urllib.request.Request('https://api.github.com' + path,
                  data=None if payload is None else json.dumps(payload).encode(), method=method,
                  headers={'Accept':'application/vnd.github+json', 'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Content-Type':'application/json', 'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          current = api('GET', f'/repos/{repo}/git/ref/heads/feat/desktop-update-all')
          assert current['object']['sha'] == old, 'PR changed concurrently; refusing candidate publication'
          files = subprocess.check_output(['git','diff','--name-only',base,'HEAD'], text=True).splitlines()
          assert len(files) == 17 and not any(p.startswith('.github/') for p in files)
          base_commit = api('GET', f'/repos/{repo}/git/commits/{base}')
          original = api('GET', f'/repos/{repo}/git/commits/{old}')
          entries = []
          for path in files:
              blob = api('POST', f'/repos/{repo}/git/blobs', {'content':base64.b64encode(Path(path).read_bytes()).decode(),'encoding':'base64'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree = api('POST', f'/repos/{repo}/git/trees', {'base_tree':base_commit['tree']['sha'],'tree':entries})
          expected_tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert tree['sha'] == expected_tree, 'Published tree differs from validated checkout'
          commit = api('POST', f'/repos/{repo}/git/commits', {'message':original['message'],'tree':tree['sha'],'parents':[base],'author':original['author']})
          branch = 'ci/recovered-118135-' + os.environ['GITHUB_RUN_ID']
          api('POST', f'/repos/{repo}/git/refs', {'ref':'refs/heads/'+branch,'sha':commit['sha']})
          manifest = {'old_head':old,'base':base,'candidate':commit['sha'],'tree':tree['sha'],'branch':branch,'run':os.environ['GITHUB_RUN_ID'],'files':files}
          Path('/tmp/recovery-evidence/candidate.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload diagnosis, patch and test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-118135-recovery-evidence
          path: /tmp/recovery-evidence
          retention-days: 7
