name: Recover PR 118135 - native and adjacent checks

on:
  push:
    branches: [ci/review-polish-118135]

permissions:
  contents: read

env:
  CANDIDATE: 248116df22b272d0f0ecd3daa68c7e0c869858f8
  EXPECTED_TREE: 397019f1b1f5160c9be27b26078a32de758282bc
  BASE: f4bdc3dd28f4fc98f618db9323be1262b107f995

jobs:
  adjacent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 248116df22b272d0f0ecd3daa68c7e0c869858f8
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact validated tree and minimal scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" -eq 17
          test -z "$(git diff --name-only "$BASE" HEAD -- .github/ package-lock.json uv.lock pyproject.toml)"
          git diff --check "$BASE" HEAD
          mkdir -p "$RUNNER_TEMP/final-evidence"
          git show --no-patch --format=fuller HEAD > "$RUNNER_TEMP/final-evidence/candidate.txt"
          git diff --stat "$BASE" HEAD >> "$RUNNER_TEMP/final-evidence/candidate.txt"
          echo "Previously validated exact source: run 36265777632, artifact 10913767896; all runtime/static steps passed, only Actions ref publication was denied."
      - name: Prepare locked Python and Node
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          test-environment: 'true'
      - name: Adjacent GUI and parser regressions
        shell: bash
        run: |
          set -euo pipefail
          scripts/run_tests.sh -j 2 tests/hermes_cli/test_gui_command.py tests/hermes_cli/test_subcommands_batch.py --file-retries 0 2>&1 | tee "$RUNNER_TEMP/final-evidence/python-adjacent.log"
      - name: Install committed JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Desktop integration hook regression
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run src/app/contrib/hooks/use-desktop-integrations.test.tsx --maxWorkers=2 2>&1 | tee "$RUNNER_TEMP/final-evidence/hooks.log"
      - name: Preserve final evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-adjacent-evidence
          path: ${{ runner.temp }}/final-evidence
          retention-days: 7
  native-launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 248116df22b272d0f0ecd3daa68c7e0c869858f8
          persist-credentials: false
      - name: Verify exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
      - name: Prepare native locked Python
        uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
      - name: Native launcher handoff and CLI regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/run_tests.sh -j 1 tests/hermes_cli/test_desktop_update_request.py --file-retries 0 2>&1 | tee "$RUNNER_TEMP/native-launcher.log"
      - name: Preserve native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-launcher-${{ matrix.os }}
          path: ${{ runner.temp }}/native-launcher.log
          retention-days: 7
