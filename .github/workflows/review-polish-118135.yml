name: Rebase probe 118135

on:
  push:
    branches: [ci/review-polish-118135]

permissions:
  contents: read

jobs:
  rebase-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Cherry-pick feature onto current upstream main
        shell: bash
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main
          git checkout --detach upstream/main
          git cherry-pick 1c8292d3c9780092c511da81ca2b66ddf8397777
          git cherry-pick bf5e23088226a9b49ff4ef14063f9fa39f771fe4
          git cherry-pick 919c5368037e605560f4d0996cc605ce31081800
          git diff upstream/main...HEAD --check
          git log --oneline -4
